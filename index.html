<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Public Social Media Viewer & Downloader</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #111; }
    .row { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 10px 18px; font-size: 16px; cursor: pointer; border: none; border-radius: 6px; background: #111; color: #fff; }
    button:disabled { opacity: 0.6; cursor: wait; }
    .card { margin-top: 24px; border: 1px solid #e5e5e5; border-radius: 10px; padding: 16px; display: none; }
    .meta { margin-bottom: 16px; }
    .uploader { font-weight: 600; font-size: 14px; color: #555; }
    .desc { font-size: 14px; white-space: pre-wrap; margin-top: 6px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    .slide { border: 1px solid #eee; border-radius: 8px; padding: 10px; background: #fafafa; display: flex; flex-direction: column; justify-content: space-between; }
    .slide video, .slide img { width: 100%; max-height: 360px; border-radius: 6px; background: #000; object-fit: contain; }
    .btn-download { display: block; text-align: center; margin-top: 10px; padding: 8px 12px; background: #0b66ff; color: #fff; text-decoration: none; border-radius: 6px; font-size: 14px; font-weight: 500; }
    .error { color: #c00; margin-top: 16px; }
  </style>
</head>
<body>
  <h2>Public Instagram & Facebook Viewer</h2>
  <div class="row">
    <input id="urlInput" type="url" placeholder="Paste public Instagram or Facebook URL..." />
    <button id="fetchBtn" onclick="fetchContent()">Fetch</button>
  </div>
  <div id="error" class="error"></div>

  <div id="resultCard" class="card">
    <div class="meta">
      <div id="uploader" class="uploader"></div>
      <div id="description" class="desc"></div>
    </div>
    <div id="mediaGrid" class="grid"></div>
  </div>

  <script>
    const API_BASE = "http://localhost:8000";

    function proxyUrl(rawUrl, download = false, filename = "file") {
      const params = new URLSearchParams({
        media_url: rawUrl,
        download: download ? "true" : "false",
        filename: filename
      });
      return `${API_BASE}/proxy?${params.toString()}`;
    }

    async function fetchContent() {
      const url = document.getElementById("urlInput").value.trim();
      const btn = document.getElementById("fetchBtn");
      const errorEl = document.getElementById("error");
      const card = document.getElementById("resultCard");

      errorEl.textContent = "";
      card.style.display = "none";
      if (!url) return;

      btn.disabled = true;
      btn.textContent = "Fetching...";

      try {
        const res = await fetch(`${API_BASE}/fetch`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url })
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.detail || "Failed to fetch URL");
        }

        renderResult(data);
      } catch (err) {
        errorEl.textContent = err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = "Fetch";
      }
    }

    function renderResult(data) {
      const grid = document.getElementById("mediaGrid");
      grid.innerHTML = "";

      document.getElementById("uploader").textContent = data.uploader || "";
      document.getElementById("description").textContent = data.description || data.title || "";

      (data.items || []).forEach((item) => {
        const slide = document.createElement("div");
        slide.className = "slide";

        if (item.media_type === "video") {
          const video = document.createElement("video");
          video.controls = true;
          video.src = proxyUrl(item.media_url, false);
          if (item.thumbnail) video.poster = proxyUrl(item.thumbnail, false);
          slide.appendChild(video);
        } else {
          const img = document.createElement("img");
          img.src = proxyUrl(item.media_url, false);
          slide.appendChild(img);
        }

        const ext = item.ext || (item.media_type === "video" ? "mp4" : "jpg");
        const dlBtn = document.createElement("a");
        dlBtn.className = "btn-download";
        dlBtn.href = proxyUrl(item.media_url, true, `slide_${item.index}.${ext}`);
        dlBtn.textContent = `Download ${item.media_type === "video" ? "Video" : "Image"} #${item.index}`;
        slide.appendChild(dlBtn);

        grid.appendChild(slide);
      });

      document.getElementById("resultCard").style.display = "block";
    }
  </script>
</body>
</html>
