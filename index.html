<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Public Social Media Viewer & Downloader</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #111; }
    .row { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 10px 18px; font-size: 16px; cursor: pointer; border: none; border-radius: 6px; background: #111; color: #fff; }
    button:disabled { opacity: 0.6; cursor: wait; }
    .card { margin-top: 24px; border: 1px solid #e5e5e5; border-radius: 10px; padding: 16px; display: none; }
    .card video, .card img { width: 100%; max-height: 480px; border-radius: 8px; background: #000; object-fit: contain; }
    .meta { margin: 12px 0; }
    .uploader { font-weight: 600; font-size: 14px; color: #555; }
    .desc { font-size: 14px; white-space: pre-wrap; margin-top: 6px; }
    .actions { display: flex; gap: 10px; margin-top: 14px; }
    .btn-download { display: inline-block; padding: 10px 16px; background: #0b66ff; color: #fff; text-decoration: none; border-radius: 6px; font-size: 14px; font-weight: 500; }
    .error { color: #c00; margin-top: 16px; }
  </style>
</head>
<body>
  <h2>Public Instagram & Facebook Viewer</h2>
  <div class="row">
    <input id="urlInput" type="url" placeholder="Paste public Instagram or Facebook URL..." />
    <button id="fetchBtn" onclick="fetchContent()">Fetch</button>
  </div>
  <div id="error" class="error"></div>

  <div id="resultCard" class="card">
    <div id="mediaContainer"></div>
    <div class="meta">
      <div id="uploader" class="uploader"></div>
      <div id="description" class="desc"></div>
    </div>
    <div class="actions" id="actions"></div>
  </div>

  <script>
    const API_BASE = "http://localhost:8000";

    function proxyUrl(rawUrl, download = false, filename = "file") {
      const params = new URLSearchParams({
        media_url: rawUrl,
        download: download ? "true" : "false",
        filename: filename
      });
      return `${API_BASE}/proxy?${params.toString()}`;
    }

    async function fetchContent() {
      const url = document.getElementById("urlInput").value.trim();
      const btn = document.getElementById("fetchBtn");
      const errorEl = document.getElementById("error");
      const card = document.getElementById("resultCard");

      errorEl.textContent = "";
      card.style.display = "none";
      if (!url) return;

      btn.disabled = true;
      btn.textContent = "Fetching...";

      try {
        const res = await fetch(`${API_BASE}/fetch`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url })
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.detail || "Failed to fetch URL");
        }

        renderResult(data);
      } catch (err) {
        errorEl.textContent = err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = "Fetch";
      }
    }

    function renderResult(data) {
      const mediaContainer = document.getElementById("mediaContainer");
      const actions = document.getElementById("actions");
      mediaContainer.innerHTML = "";
      actions.innerHTML = "";

      document.getElementById("uploader").textContent = data.uploader || "";
      document.getElementById("description").textContent = data.description || data.title || "";

      if (data.type === "video" && data.media_url) {
        const video = document.createElement("video");
        video.controls = true;
        video.src = proxyUrl(data.media_url, false);
        if (data.thumbnail) {
          video.poster = proxyUrl(data.thumbnail, false);
        }
        mediaContainer.appendChild(video);

        const dlVideo = document.createElement("a");
        dlVideo.className = "btn-download";
        dlVideo.href = proxyUrl(data.media_url, true, `video.${data.ext || "mp4"}`);
        dlVideo.textContent = "Download Video";
        actions.appendChild(dlVideo);
      } else if (data.thumbnail) {
        const img = document.createElement("img");
        img.src = proxyUrl(data.thumbnail, false);
        mediaContainer.appendChild(img);

        const dlImg = document.createElement("a");
        dlImg.className = "btn-download";
        dlImg.href = proxyUrl(data.thumbnail, true, "post.jpg");
        dlImg.textContent = "Download Image";
        actions.appendChild(dlImg);
      }

      document.getElementById("resultCard").style.display = "block";
    }
  </script>
</body>
</html>
